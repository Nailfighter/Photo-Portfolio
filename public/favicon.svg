<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Lens Gradients -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Camera Body -->
  <rect x="32" y="128" width="448" height="320" rx="64" fill="url(#bodyGrad)" stroke="#334155" stroke-width="8"/>
  
  <!-- Camera Top Details (Flash/Dial) -->
  <path d="M144 128 L144 96 C144 80 160 64 176 64 L336 64 C352 64 368 80 368 96 L368 128 Z" fill="#334155" />
  <rect x="96" y="96" width="32" height="32" rx="8" fill="#475569" />
  <circle cx="396" cy="96" r="16" fill="#EF4444" />

  <!-- Outer Lens Ring -->
  <circle cx="256" cy="288" r="110" fill="#1E293B" stroke="#475569" stroke-width="12" />
  
  <!-- Inner Lens with Vibrant Gradient -->
  <circle cx="256" cy="288" r="80" fill="url(#lensGrad)" filter="url(#glow)" />
  
  <!-- Lens Reflection/Shine -->
  <path d="M220 252 A 50 50 0 0 1 292 252" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  <circle cx="280" cy="264" r="10" fill="#FFFFFF" opacity="0.8" />
  <circle cx="230" cy="310" r="6" fill="#FFFFFF" opacity="0.5" />
  
  <!-- Small details (Viewfinder / sensor light) -->
  <rect x="96" y="176" width="48" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="4" />
  <circle cx="400" cy="180" r="10" fill="#10B981" />
</svg>